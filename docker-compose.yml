# Local Postgres for development and tests. Production = Supabase (see docs/runbooks/deploy.md).
services:
  db:
    build: ./db/docker
    container_name: expendables-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expendables
    ports:
      - "54329:5432"
    volumes:
      - expendables-pgdata:/var/lib/postgresql/data
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expendables"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  expendables-pgdata:

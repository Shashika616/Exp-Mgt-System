# Dependency build scripts are never run (docs/security.md A02/A03: no postinstall scripts).
allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: false
minimumReleaseAgeExclude:
  - next@16.3.5
# pnpm 12 supply-chain policy: we pin exact versions and review the lockfile in PRs instead of a release-age gate.
minimumReleaseAge: 0
# Dev-only transitive esbuild (<0.25) pinned by drizzle-kit's loader: force the patched line (GHSA-67mh-4wv8-2f99).
overrides:
  "esbuild@<0.25.0": ">=0.25.0"
